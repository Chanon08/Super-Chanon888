<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จับคู่โน้ต</title>
<style>
:root{--bg1:#f4f1ff;--bg2:#dcd4ff;--ink:#1b1740;--mut:#5d5784;--card:#ffffff;--gold:#c98a00;--a:#5b3df5;--b:#19a89c;--ok:#12926a;--bad:#d6335f;--line:#cfc7f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#120f2e;--bg2:#2a1d5c;--ink:#f3efff;--mut:#b9b0e6;--card:#241d52;--gold:#f2b632;--a:#8a73ff;--b:#35d1c3;--ok:#3fe0a6;--bad:#ff6b92;--line:#3b3180}}
:root[data-theme="dark"]{--bg1:#120f2e;--bg2:#2a1d5c;--ink:#f3efff;--mut:#b9b0e6;--card:#241d52;--gold:#f2b632;--a:#8a73ff;--b:#35d1c3;--ok:#3fe0a6;--bad:#ff6b92;--line:#3b3180}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1));min-height:100vh;padding:18px 14px 40px}
.wrap{max-width:660px;margin:0 auto}
h1{margin:0;font-size:clamp(28px,7vw,40px);line-height:1.2;font-weight:800;letter-spacing:.5px}
h1 span{color:var(--gold)}
.sub{margin:4px 0 14px;color:var(--mut);font-size:15px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tools{display:flex;gap:8px}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:19px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seg button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
.seg .lbl{align-self:center;color:var(--mut);font-size:14px;min-width:56px}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.hud div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.hud b{display:block;font-size:clamp(17px,4.6vw,22px);font-variant-numeric:tabular-nums}
.hud small{color:var(--mut);font-size:12px}
.hud .cb.hot b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:10px}
.card{perspective:900px;aspect-ratio:3/4;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card.open .in,.card.ok .in{transform:rotateY(180deg)}
.f,.k{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;box-shadow:0 6px 16px rgba(20,10,60,.28)}
.f{color:var(--gold);font-size:clamp(26px,8vw,42px);background:repeating-linear-gradient(to bottom,transparent 0 22%,rgba(255,255,255,.35) 22% 23.2%),linear-gradient(145deg,var(--a),#2b1c8f 70%);border:2px solid rgba(255,255,255,.25)}
.k{background:var(--card);border:2px solid var(--line);transform:rotateY(180deg);text-align:center}
.k svg{width:84%;max-height:68%;color:var(--ink)}
.k b{font-size:clamp(13px,3.7vw,18px);line-height:1.25}
.k small{color:var(--mut);font-size:clamp(11px,3vw,14px)}
.k .ic{font-size:clamp(28px,8vw,42px)}
.card.ok .k{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok),0 0 24px var(--ok)}
.card.bad{animation:shake .4s}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:14px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ov{position:fixed;inset:0;background:rgba(10,6,30,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.on{display:flex}
.box{background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:26px 22px;max-width:380px;width:100%;text-align:center}
.box h2{margin:0 0 4px;font-size:28px}
.stars{font-size:44px;color:var(--gold);letter-spacing:6px;margin:4px 0}
.box p{margin:6px 0;color:var(--mut)}
.box button{margin-top:14px;min-height:48px;padding:0 26px;border-radius:12px;border:0;background:var(--a);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.pc{position:fixed;top:-30px;font-size:26px;z-index:30;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
.hint{margin-top:16px;color:var(--mut);font-size:14px;text-align:center}
@media (prefers-reduced-motion:reduce){.in{transition:none}.card.bad{animation:none}.pc{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>จับคู่<span>โน้ต</span> ♪</h1><p class="sub">เปิดการ์ดสองใบ จับคู่สัญลักษณ์ ชื่อ และเสียงให้ตรงกัน</p></div>
    <div class="tools"><button class="ib" id="snd" aria-label="เปิดหรือปิดเสียง">🔊</button><button class="ib" id="thm" aria-label="สลับโหมดมืด">🌓</button></div>
  </div>
  <div class="seg" id="modes"><span class="lbl">โหมด</span></div>
  <div class="seg" id="lvls"><span class="lbl">ระดับ</span></div>
  <div class="hud">
    <div><b id="hT">0:00</b><small>เวลา</small></div>
    <div><b id="hM">0</b><small>ครั้งที่เปิด</small></div>
    <div class="cb" id="hCb"><b id="hC">0</b><small>คอมโบ</small></div>
    <div><b id="hS">0</b><small>คะแนน</small></div>
    <div><b id="hB">-</b><small>สถิติ</small></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint">คอมโบต่อเนื่องได้โบนัสคะแนน · กด “เริ่มใหม่” เพื่อสับการ์ดอีกรอบ</p>
  <div class="seg" style="justify-content:center"><button id="rst" style="background:var(--b);border-color:var(--b);color:#fff;font-weight:700">เริ่มใหม่</button></div>
</div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="wt"><div class="box">
  <h2 id="wt">เก่งมาก!</h2><div class="stars" id="wst"></div><p id="wsm"></p><p id="wbest"></p>
  <button id="again">เล่นอีกครั้ง</button>
</div></div>
<script>
const $=s=>document.querySelector(s);
const RHY=[
 {k:'w',n:'โน้ตตัวกลม',s:'4 จังหวะ',h:0,st:0,f:0},
 {k:'h',n:'โน้ตตัวขาว',s:'2 จังหวะ',h:0,st:1,f:0},
 {k:'q',n:'โน้ตตัวดำ',s:'1 จังหวะ',h:1,st:1,f:0},
 {k:'e',n:'โน้ตเขบ็ตชั้นเดียว',s:'½ จังหวะ',h:1,st:1,f:1},
 {k:'s',n:'โน้ตเขบ็ตสองชั้น',s:'¼ จังหวะ',h:1,st:1,f:2}];
const P=[
 {k:'C',n:'โด',y:70,f:261.63},{k:'D',n:'เร',y:65,f:293.66},{k:'E',n:'มี',y:60,f:329.63},
 {k:'F',n:'ฟา',y:55,f:349.23},{k:'G',n:'ซอล',y:50,f:392},{k:'A',n:'ลา',y:45,f:440},{k:'B',n:'ที',y:40,f:493.88}];
const MODES=[['rhythm','จังหวะ'],['pitch','ตำแหน่งโน้ต'],['ear','ฟังเสียง'],['mix','ผสม']];
const LV=[['easy','ง่าย',4],['mid','กลาง',6],['hard','ยาก',8]];

function nSVG(r){
  let g='<svg viewBox="0 0 60 90" aria-hidden="true"><g fill="currentColor" stroke="currentColor">';
  g+='<ellipse cx="26" cy="68" rx="12" ry="8.5" transform="rotate(-20 26 68)" fill="'+(r.h?'currentColor':'none')+'" stroke-width="3"/>';
  if(r.st){g+='<line x1="37" y1="66" x2="37" y2="14" stroke-width="3"/>';
    for(let i=0;i<r.f;i++)g+='<path d="M37 '+(14+i*12)+'c2 14 16 16 14 32" fill="none" stroke-width="3"/>';}
  return g+'</g></svg>';
}
function sSVG(p){
  let g='<svg viewBox="0 0 100 90" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" fill="none">';
  for(let y=20;y<=60;y+=10)g+='<line x1="8" y1="'+y+'" x2="92" y2="'+y+'"/>';
  if(p.y===70)g+='<line x1="36" y1="70" x2="64" y2="70" stroke-width="2"/>';
  g+='</g><ellipse cx="50" cy="'+p.y+'" rx="8" ry="5.5" transform="rotate(-20 50 '+p.y+')" fill="currentColor"/>';
  g+='<line x1="57" y1="'+(p.y-1)+'" x2="57" y2="'+(p.y-30)+'" stroke="currentColor" stroke-width="2"/>';
  return g+'</svg>';
}
function pool(m){
  const r=RHY.map(x=>({k:x.k,a:nSVG(x),b:'<b>'+x.n+'</b><small>'+x.s+'</small>'}));
  const p=P.map(x=>({k:x.k,a:sSVG(x),b:'<b>'+x.n+'</b><small>'+x.k+'</small>',f:x.f}));
  const e=P.map(x=>({k:x.k,a:sSVG(x),b:'<span class="ic">🔊</span><small>ฟังเสียง</small>',f:x.f,snd:1}));
  return {rhythm:r,pitch:p,ear:e,mix:r.concat(p)}[m];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let AC=null,soundOn=true;
function tone(f,d,type,v,at){
  if(!soundOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(at||0);
    o.type=type||'triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,s);g.gain.linearRampToValueAtTime(v||.25,s+.02);
    g.gain.exponentialRampToValueAtTime(.0001,s+(d||.5));
    o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+(d||.5)+.05);
  }catch(e){}
}

let S={mode:'rhythm',lv:'easy'},G=null;
function bestKey(){return 'notepairs:'+S.mode+':'+S.lv;}
function getBest(){try{const v=localStorage.getItem(bestKey());return v?+v:0;}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem(bestKey(),String(v));}catch(e){}}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

function start(){
  if(G&&G.t)clearInterval(G.t);
  const n=LV.find(l=>l[0]===S.lv)[2];
  const pl=shuffle(pool(S.mode)).slice(0,n);
  const cards=shuffle(pl.flatMap(x=>[
    {k:x.k,h:x.a,f:x.snd?0:x.f},
    {k:x.k,h:x.b,f:x.f}
  ]));
  G={cards:cards,pairs:pl.length,open:[],done:0,moves:0,combo:0,score:0,sec:0,lock:false,t:null,st:{}};
  const gr=$('#grid');
  gr.style.setProperty('--c',cards.length===10?5:4);
  gr.innerHTML=cards.map((c,i)=>'<button class="card" data-i="'+i+'" aria-label="การ์ดใบที่ '+(i+1)+'"><div class="in"><div class="f">♪</div><div class="k">'+c.h+'</div></div></button>').join('');
  hud();
}
function hud(){
  $('#hT').textContent=fmt(G.sec);$('#hM').textContent=G.moves;
  $('#hC').textContent=G.combo;$('#hCb').classList.toggle('hot',G.combo>=2);
  $('#hS').textContent=G.score;$('#hB').textContent=getBest()||'-';
}
function flip(i){
  if(G.lock)return;
  const el=$('#grid').children[i],c=G.cards[i];
  if(el.classList.contains('open')||el.classList.contains('ok'))return;
  if(!G.t)G.t=setInterval(()=>{G.sec++;hud();},1000);
  el.classList.add('open');G.open.push(i);
  if(c.f)tone(c.f,.6);else tone(660,.12,'sine',.12);
  if(G.open.length<2)return;
  G.moves++;G.lock=true;
  const [a,b]=G.open,ea=$('#grid').children[a],eb=$('#grid').children[b];
  if(G.cards[a].k===G.cards[b].k){
    setTimeout(()=>{
      ea.classList.replace('open','ok');eb.classList.replace('open','ok');
      G.score+=100+G.combo*25;G.combo++;G.done++;G.open=[];G.lock=false;
      tone(784,.18,'sine',.2);tone(1046,.3,'sine',.2,.12);hud();
      if(G.done===G.pairs)win();
    },450);
  }else{
    G.combo=0;
    setTimeout(()=>{
      ea.classList.add('bad');eb.classList.add('bad');tone(180,.25,'sawtooth',.1);
      setTimeout(()=>{
        ea.classList.remove('open','bad');eb.classList.remove('open','bad');
        G.open=[];G.lock=false;hud();
      },420);
    },500);
  }
  hud();
}
function win(){
  clearInterval(G.t);G.t=null;
  const r=G.moves/G.pairs;
  const stars=r<=1.6?3:r<=2.4?2:1;
  const bonus=Math.max(0,300-G.sec*3);
  G.score+=bonus;hud();
  const old=getBest();
  const isBest=G.score>old;
  if(isBest)setBest(G.score);
  $('#wst').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('#wsm').textContent='คะแนน '+G.score+' · เปิด '+G.moves+' ครั้ง · เวลา '+fmt(G.sec)+' (โบนัสเวลา +'+bonus+')';
  $('#wbest').textContent=isBest?'สถิติใหม่!':'สถิติเดิม '+old;
  hud();
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.5,'triangle',.22,i*.15));
  $('#ov').classList.add('on');$('#again').focus();
  for(let i=0;i<36;i++){
    const s=document.createElement('span');s.className='pc';
    s.textContent=['♪','♫','♩','★'][i%4];
    s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.8+'s';
    s.style.color=['#f2b632','#35d1c3','#ff6b92','#8a73ff'][i%4];
    document.body.appendChild(s);setTimeout(()=>s.remove(),3600);
  }
}
function seg(id,items,key){
  const box=$(id);
  items.forEach(it=>{
    const b=document.createElement('button');b.textContent=it[1];b.dataset.v=it[0];
    b.addEventListener('click',()=>{S[key]=it[0];sync();start();});
    box.appendChild(b);
  });
}
function sync(){
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.mode));
  document.querySelectorAll('#lvls button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.lv));
}
seg('#modes',MODES,'mode');seg('#lvls',LV,'lv');sync();
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)flip(+c.dataset.i);});
$('#rst').addEventListener('click',start);
$('#again').addEventListener('click',()=>{$('#ov').classList.remove('on');start();});
$('#snd').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';});
$('#thm').addEventListener('click',()=>{
  const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  d.dataset.theme=cur==='dark'?'light':'dark';
});
start();
</script>
</body>
</html>
